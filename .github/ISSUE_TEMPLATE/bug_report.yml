name: 🐛 Bug Report
description: Report a bug in traffic-processor, communication-node, cnss, or mui
title: "[Bug] Short description of the issue"
labels: ["bug"]
body:
  - type: dropdown
    id: component
    attributes:
      label: Affected Component
      options:
        - traffic-processor (TP)
        - communication-node (CN)
        - cnss (Backend)
        - mui (Frontend)
        - CI/CD or GitHub Actions
        - General / Monorepo
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: "A clear and concise description of what the bug is."
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: "1. Go to '...'\n2. Click on '...'\n3. See error"
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: "What should happen?"
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: "What actually happens?"
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: "OS, Node/Python version, browser (if MUI), etc."