name: 🎓 Course Task
description: Template for assignment administration, reports, and process tasks
title: "[Course Task] Short description of the administrative task"
labels: ["course-task", "administration"]
body:
  - type: textarea
    id: description
    attributes:
      label: Task Objective
      description: "What needs to be delivered for this course requirement?"
    validations:
      required: true
  - type: textarea
    id: checklist
    attributes:
      label: Completion Checklist
      description: "Check off items as they are completed."
      value: |
        - [ ] Task objective achieved
        - [ ] Added to `reports/week3/README.md` index (if applicable)
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes and Constraints
      description: "Any additional context, limitations, or specific instructions for this task."
      # Отсутствие блока validations делает это поле необязательным (optional)