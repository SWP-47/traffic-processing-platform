name: 🎓 Course Task
description: Template for assignment administration, reports, and process tasks
title: "[Course Task] Short description of the administrative task"
labels: ["course-task", "administration"]
body:
  - type: dropdown
    id: assignment
    attributes:
      label: Related Assignment
      options:
        - Assignment 1
        - Assignment 2
        - Assignment 3
        - Assignment 4
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Task Objective
      description: "What needs to be delivered for this course requirement?"
    validations:
      required: true
  - type: textarea
    id: checklist
    attributes:
      label: Completion Checklist
      description: "Check off artifacts as they are created and linked."
      value: |
        - [ ] Task objective achieved
        - [ ] Artifact created/updated (link below)
        - [ ] Added to `reports/week3/README.md` index (if applicable)
    validations:
      required: true
  - type: input
    id: artifact_link
    attributes:
      label: Link to Artifact
      description: "e.g., reports/week3/README.md or docs/user-stories.md"