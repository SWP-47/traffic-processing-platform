name: 📖 User Story
description: Template for migrating and creating User Stories (PBIs)
title: "[US-XXX] Short summary of the user story"
labels: ["user-story"]
body:
  - type: input
    id: stable_id
    attributes:
      label: Stable User Story ID
      description: "e.g., US-001. Do not change or reuse stable IDs."
      placeholder: "US-001"
    validations:
      required: true
  - type: textarea
    id: statement
    attributes:
      label: User Story Statement
      description: "As a [role], I want [feature], so that [benefit]."
      placeholder: "As a system administrator, I want to see a simple indicator of channel activity, so that I can quickly see if a connection is active."
    validations:
      required: true
  - type: dropdown
    id: moscow
    attributes:
      label: MoSCoW Priority
      options:
        - Must Have
        - Should Have
        - Could Have
        - Won't Have
    validations:
      required: true
  - type: dropdown
    id: req_status
    attributes:
      label: Requirement Status
      options:
        - Active
        - Removed
    validations:
      required: true
  - type: dropdown
    id: mvp_version
    attributes:
      label: MVP Version
      description: "Required for Assignment 3 tracking"
      options:
        - MVP v1
        - MVP v2
        - MVP v3
        - N/A (Backlog)
    validations:
      required: true
  - type: dropdown
    id: story_points
    attributes:
      label: Story Points
      options: ["1", "2", "3", "5", "8", "13", "?"]
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes, Constraints, Assumptions, Open Questions
      description: "Any additional context from Assignment 2 or refinement."
  - type: textarea
    id: acceptance_criteria
    attributes:
      label: Acceptance Criteria
      description: "At least 3 ACs required for MVP v1 PBIs. Use the Given/When/Then format."
      value: |
        #### AC 1
        > **Given** [initial context], **When** [action occurs]
        - [ ] **Then** [expected outcome]

        #### AC 2
        > **Given** [initial context], **When** [action occurs]
        - [ ] **Then** [expected outcome]

        #### AC 3
        > **Given** [initial context], **When** [action occurs]
        - [ ] **Then** [expected outcome]
    validations:
      required: true
  - type: input
    id: reviewer
    attributes:
      label: Assigned Reviewer
      description: "GitHub username of the team member who will review this PBI"
      placeholder: "@username"