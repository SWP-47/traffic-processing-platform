name: CI

on:
  pull_request:
    branches: [ develop, general ]
  workflow_dispatch:

jobs:
  traffic-processor:
    name: TP Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: traffic-processor/software-part
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint code
        run: |
          black --check .
          flake8 .

      - name: Run unit tests
        run: |
          pip install pytest
          pytest tests/ -q

  communication-node:
    name: CN Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: communication-node
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint code
        run: |
          black --check .
          flake8 .

      # - name: Run unit tests
      #   run: |
      #     pip install pytest
      #     pytest tests/ -q

  cnss:
    name: CnSS Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cnss

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Lint code (Ruff, Flake8, Mypy, Black)
        run: |
          uv run ruff check .
          uv run flake8 .
          uv run mypy .
          uv run black --check .

      - name: Start infrastructure (TimescaleDB, Redis)
        run: docker compose -f docker-compose.dev.yml up -d

      - name: Wait for infrastructure to be ready
        run: |
          timeout 60 bash -c 'until docker compose -f docker-compose.dev.yml exec -T timescaledb pg_isready -U cnss; do sleep 2; done'
          timeout 60 bash -c 'until docker compose -f docker-compose.dev.yml exec -T redis redis-cli ping; do sleep 2; done'

      - name: Run database migrations
        env:
          # Переопределяем URL на localhost, так как тесты запускаются на хосте runner, а не в Docker-сети
          DATABASE_URL: postgresql+asyncpg://cnss:cnss@localhost:5432/cnss
        run: uv run alembic upgrade head

      - name: Install coverage tools
        run: uv pip install pytest-cov

      - name: Run coverage gate
        env:
          REDIS_URL: redis://localhost:6379/0
          DATABASE_URL: postgresql+asyncpg://cnss:cnss@localhost:5432/cnss
        run: |
          uv run pytest --cov=core --cov=services --cov-report=term-missing --cov-fail-under=30 tests/ -q

      - name: Stop infrastructure
        if: always()
        run: docker compose -f docker-compose.dev.yml down -v

      - name: Run dependency audit
        run: |
          # Generation of requirements.txt for pip-audit
          uv pip compile pyproject.toml --all-extras -o requirements.txt
          uv pip install pip-audit
          uv run pip-audit -r requirements.txt
  mui:
    name: MUI Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mui
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: mui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint and type check
        run: |
          npm run lint
          npm run test:ts

      - name: Build production bundle
        run: npm run build
