name: CI

on:
  pull_request:
    branches: [ develop, general ]
  workflow_dispatch:

jobs:
  traffic-processor:
    name: Traffic Processor Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: traffic-processor/software-part
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint code
        run: |
          black --check .
          flake8 .

      - name: Run unit tests
        run: pytest tests/ -q

  communication-node:
    name: Communication Node Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: communication-node
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint code
        run: |
          black --check .
          flake8 .

      - name: Run unit tests
        run: pytest tests/ -q

  cnss:
    name: CnSS Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cnss
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint code (Black & Flake8)
        run: |
          black --check .
          flake8 .

      - name: Run containerized CnSS integration tests
        run: |
          docker compose -f docker-compose.test.yml up --build --abort-on-container-exit

      - name: Install coverage tools
        run: |
          python -m pip install pytest-cov

      - name: Run coverage gate
        run: |
          pytest --cov=app --cov-report=term-missing --cov-fail-under=30 tests/ -q

      - name: Run dependency audit
        run: |
          python -m pip install pip-audit
          python -m pip_audit -r requirements.txt

  mui:
    name: MUI Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mui
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint and type check
        run: |
          npm run lint
          npm run test:ts

      - name: Build production bundle
        run: npm run build
