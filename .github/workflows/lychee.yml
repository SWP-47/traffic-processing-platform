name: Lychee Link Check

on:
  push:
    branches: [ "general", "develop" ]
  pull_request:

jobs:
  linkChecker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      # 1. Restore lychee cache (to avoid hitting rate limits and speed up CI)
      - name: Restore lychee cache
        id: restore-cache
        uses: actions/cache/restore@v4
        with:
          path: .lycheecache
          key: cache-lychee-${{ github.sha }}
          restore-keys: cache-lychee-

      # 2. Checkout repository (using stable v4)
      - name: Checkout repository
        uses: actions/checkout@v4

      # 3. Run Lychee link checker
      - name: Link Checker
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          # Arguments passed directly to the lychee binary
          args: >-
            --cache
            --max-cache-age 1d
            --verbose
            --no-progress
            './**/*.md'
          fail: true 
        env:
          # Use GITHUB_TOKEN to avoid rate limits when checking links to GitHub repositories
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 4. Save lychee cache (even if the check fails, so next run is faster)
      - name: Save lychee cache
        uses: actions/cache/save@v4
        if: always()
        with:
          path: .lycheecache
          key: ${{ steps.restore-cache.outputs.cache-primary-key }}