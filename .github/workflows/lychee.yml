name: Lychee Link Check

on:
  push:
    branches: [ "general", "develop" ]
  pull_request:

jobs:
  linkChecker:
    runs-on: ubuntu-latest
    permissions:
      contents: read      # Required to checkout code
      issues: write       # Required to post comment (optional but recommended)
      pull-requests: write # Required to post comment on PR
    steps:
      # 1. Restore lychee cache (to avoid hitting rate limits and speed up CI)
      - name: Restore lychee cache
        id: restore-cache
        uses: actions/cache/restore@v4
        with:
          path: .lycheecache
          key: cache-lychee-${{ github.sha }}
          restore-keys: cache-lychee-

      # 2. Checkout repository
      - uses: actions/checkout@v5

      # 3. Run Lychee link checker
      - name: Link Checker
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          # Arguments:
          # --cache: Use cache to speed up subsequent runs
          # --verbose: Show detailed output
          # --no-progress: Disable progress bar (cleaner CI logs)
          # --fail: Exit with non-zero code if broken links are found (CRITICAL for CI)
          # './**/*.md': Check all Markdown files in the repo (including docs/ and reports/)
          args: >-
            --cache
            --max-cache-age 1d
            --verbose
            --no-progress
            --fail
            './**/*.md'
        env:
          # Use GITHUB_TOKEN to avoid rate limits when checking links to GitHub repositories
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 4. Save lychee cache (even if the check fails, so next run is faster)
      - name: Save lychee cache
        uses: actions/cache/save@v4
        if: always()
        with:
          path: .lycheecache
          key: ${{ steps.restore-cache.outputs.cache-primary-key }}