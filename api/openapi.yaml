openapi: 3.0.3
info:
  title: Traffic Processing Platform API
  description: |
    API documentation for the Control and Status Server (CnSS).
    
    ## Ingestion (CN to CnSS)
    - **Protocol**: UDP
    - **Endpoint**: `{{cnss_host}}:{{cnss_udp_port}}`
    - **Payload Schema**: `TelemetryBatch` (defined in components/schemas)
    - **UDP MTU Constraint**: CN must ensure the serialized JSON payload does not exceed 1400 bytes. Adjust `window_ms` to prevent IP fragmentation.

    ## Authentication
    - **Endpoint**: `POST /api/v1/auth/login`
    - **Mechanism**: JWT Bearer Token. The token contains `role` and `scope` claims for per-channel access control.

    ## WebSocket Stream (CnSS to MUI)
    - **Endpoint**: `wss://{{cnss_host}}:{{cnss_ws_port}}/api/v1/ws/telemetry`
    - **Auth**: Query parameters `?token={{access_token}}&channel_id={{channel_id}}`
    - **Payload Schema**: `TelemetryUpdate` (defined in components/schemas)
    - **Frequency**: 1 Hz (aggregated by Reporting Worker from TimescaleDB)
    - **Keep-Alive**: CnSS sends periodic `ping` frames. MUI must respond with `pong`.
  version: 1.1.0

servers:
  - url: https://{{cnss_host}}
    description: CnSS REST Server
  - url: wss://{{cnss_host}}:{{cnss_ws_port}}
    description: CnSS WebSocket Server

paths:
  /api/v1/auth/login:
    post:
      summary: User Authentication
      description: Authenticate user and issue JWT token with role and scope information.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Successful authentication
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          description: Bad request (missing fields)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/health:
    get:
      summary: System Health Check
      description: Verify operational status of the CnSS and aggregate channel statistics.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: System is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '503':
          description: System is unhealthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /api/v1/channels:
    get:
      summary: List Accessible Channels
      description: |
        List all channels accessible to the authenticated user.
        For `viewer`, the list is filtered by JWT `scope`.
        For `admin`, all known channels are returned.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of channels
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChannelsResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/channel/{channel_id}/status:
    get:
      summary: Specific Channel Activity Status
      description: REST fallback for a specific channel's activity indicator.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: channel_id
          required: true
          schema:
            type: string
          description: Identifier of the channel to query.
      responses:
        '200':
          description: Channel status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChannelStatusResponse'
        '403':
          description: Forbidden (user has no access to this channel)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Channel not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/channel/{channel_id}/history:
    get:
      summary: Historical Telemetry Data (Line Chart)
      description: |
        Lazy-loads historical telemetry data for the Line Chart. 
        CnSS dynamically calculates the optimal `time_bucket` interval based on the requested period.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: channel_id
          required: true
          schema:
            type: string
        - in: query
          name: period
          required: true
          schema:
            type: string
            enum: ["1h", "24h", "7d", "30d"]
          description: Time period to query.
      responses:
        '200':
          description: Aggregated historical points
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HistoryResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Channel not found

  /api/v1/ws/telemetry:
    get:
      summary: Real-time Telemetry Stream (WebSocket)
      description: |
        Upgrades to WebSocket for real-time push stream, scoped to a specific channel.
        Auth via query parameters `?token={{access_token}}&channel_id={{channel_id}}`.

        **Connection Lifecycle & Close Codes:**
        1. MUI opens WebSocket connection with `token` and `channel_id`.
        2. CnSS validates token. On failure, closes with code `4001` (invalid_token).
        3. CnSS checks if the `channel_id` query parameter is present in the URL. On failure, closes with code `4002` (missing_channel).
        4. CnSS checks access to `channel_id` via JWT scope. On failure, closes with code `4003` (channel_forbidden).
        5. CnSS checks if the provided `channel_id` value exists in the registry. On failure, closes with code `4004` (channel_not_found).
        6. CnSS pushes `telemetry_update` frames at 1 Hz (aggregated by Reporting Worker from TimescaleDB).
        7. **Keep-Alive:** CnSS sends periodic `ping` frames. MUI must respond with `pong`.
        8. If no telemetry from CN for 5000ms, CnSS sends `is_active: false`.
        9. **Control Messages:** MUI can send JSON text frames to manage subscriptions for host tables (e.g., `{"action": "subscribe", "target": "lan_hosts"}`).
        10. **Host Updates:** CnSS pushes `hosts_update` frames to subscribed clients containing real-time LAN/WAN host statistics.

        *Security Note: CnSS MUST NOT log the full request URL to prevent token leakage.*
      parameters:
        - in: query
          name: token
          schema:
            type: string
          description: Bearer token for authentication
          required: true
        - in: query
          name: channel_id
          schema:
            type: string
          description: Identifier of the channel to subscribe to
          required: true
      responses:
        '101':
          description: Switching Protocols to WebSocket

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    LoginRequest:
      type: object
      required:
        - username
        - password
      properties:
        username:
          type: string
          example: "admin"
        password:
          type: string
          format: password
          example: "secretpassword"

    LoginResponse:
      type: object
      properties:
        access_token:
          type: string
          description: JWT token for authenticated requests.
          example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
        token_type:
          type: string
          example: "Bearer"
        expires_in:
          type: integer
          description: Token lifetime in seconds.
          example: 86400
        issued_at:
          type: string
          format: date-time
          example: "2026-06-18T12:00:00Z"
        role:
          type: string
          enum: [admin, viewer]
          example: "admin"
        scope:
          type: array
          items:
            type: string
          description: List of accessible channel_ids.
          example: ["bridge-berlin-01", "bridge-prague-01"]

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
          example: "invalid_credentials"
        message:
          type: string
          example: "Invalid username or password."

    HealthResponse:
      type: object
      properties:
        status:
          type: string
          enum: [healthy, degraded, unhealthy]
          example: "healthy"
        components:
          type: object
          properties:
            cnss:
              type: string
              enum: [active, inactive, error]
              example: "active"
        channels_active:
          type: integer
          description: Number of channels currently reporting telemetry.
          example: 3
        channels_total:
          type: integer
          description: Total number of channels known to CnSS.
          example: 4
        timestamp:
          type: string
          format: date-time
          example: "2026-06-17T12:00:00Z"

    ChannelsResponse:
      type: object
      properties:
        channels:
          type: array
          items:
            $ref: '#/components/schemas/ChannelStatusResponse'
        total:
          type: integer
          example: 2

    ChannelStatusResponse:
      type: object
      properties:
        channel_id:
          type: string
          example: "bridge-berlin-01"
        is_active:
          type: boolean
          example: true
        last_activity_timestamp:
          type: string
          format: date-time
          example: "2026-06-17T12:00:00Z"

    PacketMetadata:
      type: object
      description: Raw metadata for a single observed packet.
      properties:
        direction:
          type: integer
          enum: [0, 1]
          description: "0 for IN, 1 for OUT."
          example: 0
        src_ip:
          type: string
          description: Source IP address (IPv4/IPv6).
          example: "192.168.1.100"
        dst_ip:
          type: string
          description: Destination IP address (IPv4/IPv6).
          example: "8.8.8.8"
        src_port:
          type: integer
          description: Source port.
          example: 12345
        dst_port:
          type: integer
          description: Destination port.
          example: 53

    TelemetryBatch:
      type: object
      description: |
        Payload sent from CN to CnSS over UDP.
        Contains raw packet metadata for a specific time window.
        CN must keep `window_ms` small enough to ensure the JSON payload fits within a single UDP datagram (ideally < 1400 bytes to avoid IP fragmentation).
      properties:
        channel_id:
          type: string
          description: Identifier of the monitored channel/bridge. Used by CnSS to route the batch.
          example: "bridge-berlin-01"
        timestamp:
          type: integer
          description: Unix timestamp (seconds) of the window start.
          example: 1718625600
        sequence:
          type: integer
          description: Monotonically increasing sequence number per channel. Used by CnSS to detect dropped UDP datagrams.
          example: 1042
        window_ms:
          type: integer
          description: Duration of the batching window in milliseconds. Must be kept small enough to ensure the JSON fits within the UDP MTU (< 1400 bytes).
          example: 50
        packets:
          type: array
          description: Array of raw packet metadata captured during the window.
          items:
            $ref: '#/components/schemas/PacketMetadata'

    TelemetryUpdate:
      type: object
      description: Payload pushed from CnSS to MUI over WebSocket. Aggregated by the Reporting Worker from TimescaleDB at 1 Hz.
      properties:
        type:
          type: string
          example: "telemetry_update"
        channel_id:
          type: string
          example: "bridge-berlin-01"
        is_active:
          type: boolean
          example: true
        window_ms:
          type: integer
          example: 50
        dropped_batches:
          type: integer
          description: Number of lost UDP datagrams between the previous and current batch for this channel.
          example: 0
        metrics:
          type: object
          properties:
            direction_out:
              type: object
              properties:
                packets_per_sec:
                  type: number
                  format: float
                  example: 300.0
                packets:
                  type: integer
                  example: 15
            direction_in:
              type: object
              properties:
                packets_per_sec:
                  type: number
                  format: float
                  example: 280.0
                packets:
                  type: integer
                  example: 14
        timestamp:
          type: string
          format: date-time
          description: Original timestamp from the latest CN batch.
          example: "2026-06-17T12:00:00Z"
        received_at:
          type: string
          format: date-time
          description: Server time at CnSS when the aggregation was generated by the Reporting Worker.
          example: "2026-06-17T12:00:00.050Z"

    HistoryResponse:
      type: object
      properties:
        channel_id:
          type: string
        period:
          type: string
          enum: ["1h", "24h", "7d", "30d"]
        interval_sec:
          type: integer
          description: The calculated time bucket size in seconds.
        points:
          type: array
          items:
            $ref: '#/components/schemas/HistoryPoint'

    HistoryPoint:
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
        packets_in_per_sec:
          type: number
          format: float
        packets_out_per_sec:
          type: number
          format: float
        is_active:
          type: boolean

    WSControlMessage:
      type: object
      description: Text frame sent from MUI to CnSS to manage WebSocket subscriptions.
      properties:
        action:
          type: string
          enum: ["subscribe", "unsubscribe"]
        target:
          type: string
          enum: ["lan_hosts", "wan_hosts"]
        sort_by:
          type: string
          enum: ["sent", "received", "last_seen"]
          description: Required if action is 'subscribe'.
        limit:
          type: integer
          description: Required if action is 'subscribe'. Default 5.

    HostsUpdate:
      type: object
      description: JSON frame pushed from CnSS to MUI with real-time host table data.
      properties:
        type:
          type: string
          example: "hosts_update"
        target:
          type: string
          enum: ["lan_hosts", "wan_hosts"]
        channel_id:
          type: string
        timestamp:
          type: string
          format: date-time
        hosts:
          type: array
          items:
            $ref: '#/components/schemas/HostEntry'

    HostEntry:
      type: object
      properties:
        ip:
          type: string
        sent_per_sec:
          type: number
          format: float
        received_per_sec:
          type: number
          format: float
        last_seen:
          type: string
          format: date-time