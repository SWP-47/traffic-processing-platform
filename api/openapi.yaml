openapi: 3.0.3
info:
  title: Traffic Processing Platform API
  description: |
    API documentation for the Control and Status Server (CnSS).
    
    ## Ingestion (CN to CnSS)
    - **Protocol**: UDP
    - **Endpoint**: `{{cnss_host}}:{{cnss_udp_port}}`
    - **Payload Schema**: `TelemetryBatch` (defined in components/schemas)
    - **UDP MTU Constraint**: CN must ensure the serialized JSON payload does not exceed 1400 bytes to prevent IP fragmentation.
    - **Sequence Data Type**: CN MUST implement the `sequence` field as a 64-bit integer.

    ## Authentication
    - **Mechanism**: JWT Bearer Token for REST API and WebSocket connections.
    - **Refresh Token**: Stored in an `HttpOnly`, `Secure`, `SameSite=Strict` cookie named `refresh_token`.

    ## WebSocket Stream (CnSS to MUI)
    - **Endpoint**: `wss://{{cnss_host}}:{{cnss_ws_port}}/api/v1/ws/telemetry`
    - **Auth**: Query parameters `?token={{access_token}}&channel_id={{channel_id}}`
    - **Connection Lifecycle & Close Codes**:
      - `4001` (invalid_token): JWT missing, malformed, expired, or revoked.
      - `4002` (missing_channel): `channel_id` query parameter is absent.
      - `4003` (channel_forbidden): Scope mismatch, or subscription `channel_id` differs from URL.
      - `4004` (channel_not_found): Channel or Target does not exist.
      - `1011` (internal_error): Unexpected server error.
    - **Unified Subscription Engine**: CnSS DOES NOT push data automatically. MUI MUST send a `subscribe` control message to start receiving updates. Initial snapshots are pushed immediately upon subscription.

    ## Time Parameters Note
    To ensure scalability and avoid the limitations of hardcoded Enums, all time-based parameters (e.g., `window_sec`, `period_sec`) are strictly defined in **seconds** as numeric values. This allows the frontend to request custom aggregation windows (e.g., 45 minutes, 3 hours) without requiring backend code changes or schema updates.
  version: 3.0.0

servers:
  - url: https://{{cnss_host}}
    description: CnSS REST Server (Proxied via Edge Nginx)
  - url: wss://{{cnss_host}}:{{cnss_ws_port}}
    description: CnSS WebSocket Server

paths:
  /api/v1/auth/login:
    post:
      summary: User Authentication
      description: Authenticate user and issue JWT access token. Sets `refresh_token` as an HttpOnly cookie.
      tags: [Authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Successful authentication
          headers:
            Set-Cookie:
              schema:
                type: string
                example: "refresh_token=eyJhbG...; HttpOnly; Secure; SameSite=Strict; Path=/api/v1/auth/refresh; Max-Age=604800"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/auth/refresh:
    post:
      summary: Refresh Access Token
      description: Issues a new short-lived access token using the long-lived refresh token stored in the HttpOnly cookie.
      tags: [Authentication]
      security:
        - cookieAuth: []
      responses:
        '200':
          description: New access token issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefreshTokenResponse'
        '401':
          description: Refresh token missing, invalid, expired, or revoked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/auth/logout:
    post:
      summary: User Logout
      description: Invalidates the current session by revoking the refresh token in Redis and clearing the cookie.
      tags: [Authentication]
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Successfully logged out
          headers:
            Set-Cookie:
              schema:
                type: string
                example: "refresh_token=; HttpOnly; Secure; SameSite=Strict; Path=/api/v1/auth/refresh; Max-Age=0"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogoutResponse'

  /api/v1/health:
    get:
      summary: System Health Check
      description: Verify operational status of the CnSS and aggregate channel statistics.
      tags: [System]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: System is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '503':
          description: System is unhealthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/channels:
    get:
      summary: List Accessible Channels
      description: |
        List all channels accessible to the authenticated user.
        For `viewer`, the list is filtered by JWT `scope`.
        For `admin`, all known channels are returned.
      tags: [Channels]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of channels
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChannelsListResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/channel/{channel_id}/status:
    get:
      summary: Specific Channel Activity Status
      description: REST fallback for a specific channel's activity indicator.
      tags: [Channels]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: channel_id
          required: true
          schema:
            type: string
          description: Identifier of the channel to query.
      responses:
        '200':
          description: Channel status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChannelStatus'
        '403':
          description: Forbidden (user has no access to this channel)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Channel not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/channel/{channel_id}/history:
    get:
      summary: Historical Telemetry Data (Line Chart)
      description: |
        Lazy-loads historical telemetry data for the Channel Line Chart. 
        CnSS dynamically calculates the optimal `time_bucket` interval (approx 1400 points) 
        based on the requested `period_sec` to ensure smooth chart rendering.
      tags: [History]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: channel_id
          required: true
          schema:
            type: string
          description: Identifier of the channel to query.
        - in: query
          name: period_sec
          required: true
          schema:
            type: integer
            minimum: 1
          description: Duration of the time window in seconds (e.g., 3600 for 1 hour, 86400 for 24h).
        - in: query
          name: start_time
          required: false
          schema:
            type: string
            format: date-time
          description: Start of the time range (ISO 8601). If omitted, defaults to `now - period_sec`.
      responses:
        '200':
          description: Aggregated historical points
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChannelHistoryResponse'
        '400':
          description: Bad request (invalid start_time or exceeds retention)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Channel not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/channel/{channel_id}/hosts/{host_ip}/history:
    get:
      summary: Historical Host Rx/Tx Data
      description: |
        Lazy-loads historical Rx/Tx rate data for a specific Host Line Chart.
        CnSS dynamically calculates the optimal `time_bucket` interval 
        based on the requested `period_sec` to ensure smooth chart rendering.
      tags: [History]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: channel_id
          required: true
          schema:
            type: string
          description: Identifier of the channel to query.
        - in: path
          name: host_ip
          required: true
          schema:
            type: string
          description: IP address of the host (IPv4/IPv6).
        - in: query
          name: period_sec
          required: true
          schema:
            type: integer
            minimum: 1
          description: Duration of the time window in seconds.
        - in: query
          name: start_time
          required: false
          schema:
            type: string
            format: date-time
          description: Start of the time range (ISO 8601). If omitted, defaults to `now - period_sec`.
      responses:
        '200':
          description: Aggregated host historical points
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HostHistoryResponse'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Channel or host not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/ws/telemetry:
    get:
      summary: Real-time WebSocket Gateway
      description: |
        Upgrades to WebSocket for real-time push streams, scoped to a specific channel.
        Auth via query parameters `?token={{access_token}}&channel_id={{channel_id}}`.
        
        **Control Messages:**
        MUI must send a JSON text frame to subscribe to specific data targets.
        See `WSControlMessage` schema for details on targets and parameters.
      tags: [WebSocket]
      parameters:
        - in: query
          name: token
          schema:
            type: string
          description: Bearer token for authentication
          required: true
        - in: query
          name: channel_id
          schema:
            type: string
          description: Identifier of the channel to subscribe to
          required: true
      responses:
        '101':
          description: Switching Protocols to WebSocket
          content:
            application/json:
              schema:
                type: string
                description: "WebSocket connection established. Client can now send WSControlMessage frames."

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    cookieAuth:
      type: apiKey
      in: cookie
      name: refresh_token

  schemas:
    # --- Authentication Schemas ---
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          example: "admin"
        password:
          type: string
          format: password
          example: "secretpassword"

    UserProfile:
      type: object
      description: User context required by the frontend to restore UI state.
      properties:
        id:
          type: string
          description: Internal user identifier (UUID).
          example: "usr_8f7a9b2c"
        username:
          type: string
          description: Human-readable username for UI display.
          example: "admin"
        role:
          type: string
          enum: [admin, viewer]
          description: User role.
        scope:
          type: array
          items:
            type: string
          description: List of accessible channel_ids. Empty or omitted for admin role.
          example: ["bridge-berlin-01", "bridge-prague-01"]

    TokenResponse:
      type: object
      properties:
        access_token:
          type: string
          example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
        token_type:
          type: string
          enum: [Bearer]
          example: "Bearer"
        expires_in:
          type: integer
          example: 86400
        issued_at:
          type: string
          format: date-time
        user:
          $ref: '#/components/schemas/UserProfile'

    RefreshTokenResponse:
      type: object
      description: Response for token refresh. Includes user profile to allow frontend state restoration on page reload without additional requests.
      properties:
        access_token:
          type: string
          example: "new_access_token_eyJhbG..."
        token_type:
          type: string
          enum: [Bearer]
          example: "Bearer"
        expires_in:
          type: integer
          example: 86400
        issued_at:
          type: string
          format: date-time
        user:
          $ref: '#/components/schemas/UserProfile'

    LogoutResponse:
      type: object
      properties:
        message:
          type: string
          example: "Successfully logged out."

    # --- System & Channel Schemas ---
    HealthResponse:
      type: object
      properties:
        status:
          type: string
          enum: [healthy, unhealthy]
        components:
          type: object
          additionalProperties:
            type: string
            enum: [active, error]
        channels_active:
          type: integer
        channels_total:
          type: integer
        timestamp:
          type: string
          format: date-time

    ChannelStatus:
      type: object
      properties:
        channel_id:
          type: string
        is_active:
          type: boolean
        last_activity_timestamp:
          type: string
          format: date-time
          nullable: true

    ChannelsListResponse:
      type: object
      properties:
        channels:
          type: array
          items:
            $ref: '#/components/schemas/ChannelStatus'
        total:
          type: integer

    # --- History Schemas ---
    ChannelHistoryResponse:
      type: object
      properties:
        channel_id:
          type: string
          description: Identifier of the queried channel.
        period_sec:
          type: integer
          description: Requested period duration in seconds.
        start_time:
          type: string
          format: date-time
          description: Actual start of the returned time range.
        end_time:
          type: string
          format: date-time
          description: Actual end of the returned time range.
        interval_sec:
          type: integer
          description: The calculated time bucket size in seconds.
        points:
          type: array
          items:
            $ref: '#/components/schemas/HistoryPoint'
          description: Array of aggregated data points.

    HistoryPoint:
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
          description: ISO 8601 timestamp of the data point.
        packets_in_per_sec:
          type: number
          format: float
          description: Aggregated incoming packet rate.
        packets_out_per_sec:
          type: number
          format: float
          description: Aggregated outgoing packet rate.
        bytes_in_per_sec:
          type: number
          format: float
          description: Aggregated incoming bytes rate.
        bytes_out_per_sec:
          type: number
          format: float
          description: Aggregated outgoing bytes rate.
        is_active:
          type: boolean
          description: Channel activity status at this specific timestamp (Channel History only).

    HostHistoryResponse:
      type: object
      properties:
        channel_id:
          type: string
          description: Identifier of the queried channel.
        host_ip:
          type: string
          description: IP address of the queried host.
        period_sec:
          type: integer
          description: Requested period duration in seconds.
        start_time:
          type: string
          format: date-time
          description: Actual start of the returned time range.
        end_time:
          type: string
          format: date-time
          description: Actual end of the returned time range.
        interval_sec:
          type: integer
          description: The calculated time bucket size in seconds.
        points:
          type: array
          items:
            $ref: '#/components/schemas/HostHistoryPoint'
          description: Array of aggregated data points.

    HostHistoryPoint:
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
          description: ISO 8601 timestamp of the data point.
        packets_in_per_sec:
          type: number
          format: float
          description: Aggregated incoming packet rate for the host.
        packets_out_per_sec:
          type: number
          format: float
          description: Aggregated outgoing packet rate for the host.
        bytes_in_per_sec:
          type: number
          format: float
          description: Aggregated incoming bytes rate for the host.
        bytes_out_per_sec:
          type: number
          format: float
          description: Aggregated outgoing bytes rate for the host.

    # --- Error Schema ---
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
          description: Machine-readable error code
          example: "invalid_credentials"
        message:
          type: string
          description: Human-readable description
          example: "Invalid username or password."
        details:
          type: array
          items:
            type: object
          description: Optional validation error details

    # --- UDP Ingestion Schema ---
    TelemetryBatch:
      type: object
      description: Payload sent from CN to CnSS over UDP.
      properties:
        channel_id:
          type: string
        timestamp:
          type: integer
          description: Unix timestamp (seconds)
        sequence:
          type: integer
          format: int64
          description: 64-bit monotonically increasing sequence number
        window_ms:
          type: integer
        packets:
          type: array
          items:
            $ref: '#/components/schemas/PacketFlow'

    PacketFlow:
      type: object
      properties:
        direction:
          type: integer
          enum: [0, 1]
          description: "0 for IN, 1 for OUT"
        src_ip:
          type: string
        dst_ip:
          type: string
        src_port:
          type: integer
        dst_port:
          type: integer
        protocol:
          type: string
          description: "Network protocol identifier (e.g., TCP, UDP, ICMP). Defaults to 'UNKNOWN'."
        size:
          type: integer
          description: "Packet size in bytes."

    # --- WebSocket Schemas ---
    WSControlMessage:
      type: object
      description: |
        Text frame sent from MUI to CnSS to manage WebSocket subscriptions.
        The `id` field is required and must be unique per subscription instance.
        The `params` object structure depends on the `target`.
      required: [action, id, channel_id, target]
      properties:
        action:
          type: string
          enum: [subscribe, unsubscribe]
        id:
          type: string
          description: Client-generated unique identifier
        channel_id:
          type: string
        target:
          type: string
          enum: [telemetry, hosts_table, host_details, host_top_destinations, host_top_ports]
        params:
          type: object
          description: |
            Target-specific parameters. See schemas:
            - `telemetry`: `TelemetryParams`
            - `hosts_table`: `HostsTableParams`
            - `host_details`: `HostDetailsParams`
            - `host_top_destinations`: `HostTopDestinationsParams`
            - `host_top_ports`: `HostTopPortsParams`

    TelemetryParams:
      type: object
      properties:
        window_sec:
          type: number
          format: float
          description: Aggregation time window in seconds. Defines the rolling window for `packets_per_sec` calculation.

    HostsTableParams:
      type: object
      properties:
        period_sec:
          type: integer
          description: Aggregation time window in seconds (e.g., 300 for 5m, 900 for 15m).
        location:
          type: string
          enum: [LAN, WAN]
          nullable: true
          description: Filter by network location (LAN or WAN), or null for all.
        ip:
          type: string
          nullable: true
          description: Exact IP address match filter, or null.
        sort_by:
          type: string
          enum: [location, ip, unique_destinations, tx, rx, last_activity]
        sort_order:
          type: string
          enum: [asc, desc]
        limit:
          type: integer
          description: Page size.
        offset:
          type: integer
          description: Pagination offset.

    HostDetailsParams:
      type: object
      required: [host_ip]
      properties:
        host_ip:
          type: string
          description: IP address of the specific host.
        period_sec:
          type: integer
          description: Aggregation window in seconds for real-time rate calculation.

    HostTopDestinationsParams:
      type: object
      required: [host_ip]
      properties:
        host_ip:
          type: string
          description: IP address of the specific host.
        period_sec:
          type: integer
          description: Aggregation time window in seconds.
        sort_by:
          type: string
          enum: [ip, location, received, last_seen]
        sort_order:
          type: string
          enum: [asc, desc]
        limit:
          type: integer
          description: Page size.
        offset:
          type: integer
          description: Pagination offset.

    HostTopPortsParams:
      type: object
      required: [host_ip]
      properties:
        host_ip:
          type: string
          description: IP address of the specific host.
        period_sec:
          type: integer
          description: Aggregation time window in seconds.
        sort_by:
          type: string
          enum: [port, protocol, pps]
        sort_order:
          type: string
          enum: [asc, desc]
        limit:
          type: integer
          description: Page size.
        offset:
          type: integer
          description: Pagination offset.

    # --- WebSocket Push Payloads ---
    TelemetryUpdate:
      type: object
      properties:
        type:
          type: string
          enum: [telemetry_update]
        id:
          type: string
        channel_id:
          type: string
        is_active:
          type: boolean
        window_ms:
          type: integer
        dropped_batches:
          type: integer
        metrics:
          type: object
          properties:
            direction_out:
              type: object
              properties:
                packets_per_sec:
                  type: number
                packets:
                  type: integer
                bytes_per_sec:
                  type: number
                bytes:
                  type: integer
            direction_in:
              type: object
              properties:
                packets_per_sec:
                  type: number
                packets:
                  type: integer
                bytes_per_sec:
                  type: number
                bytes:
                  type: integer
        timestamp:
          type: string
          format: date-time
        received_at:
          type: string
          format: date-time

    HostsTableUpdate:
      type: object
      properties:
        type:
          type: string
          enum: [hosts_table_update]
        id:
          type: string
        channel_id:
          type: string
        target:
          type: string
          enum: [hosts_table]
        timestamp:
          type: string
          format: date-time
        total_count:
          type: integer
        hosts:
          type: array
          items:
            $ref: '#/components/schemas/HostEntry'

    HostEntry:
      type: object
      properties:
        location:
          type: string
          enum: [LAN, WAN]
        ip:
          type: string
        unique_destinations:
          type: integer
        tx_per_sec:
          type: number
        rx_per_sec:
          type: number
        tx_bytes_per_sec:
          type: number
        rx_bytes_per_sec:
          type: number
        last_activity:
          type: string
          format: date-time

    HostDetailsUpdate:
      type: object
      properties:
        type:
          type: string
          enum: [host_details_update]
        id:
          type: string
        channel_id:
          type: string
        host_ip:
          type: string
        timestamp:
          type: string
          format: date-time
        tx_per_sec:
          type: number
        rx_per_sec:
          type: number
        tx_bytes_per_sec:
          type: number
        rx_bytes_per_sec:
          type: number

    HostTopDestinationsUpdate:
      type: object
      properties:
        type:
          type: string
          enum: [host_top_destinations_update]
        id:
          type: string
        channel_id:
          type: string
        host_ip:
          type: string
        timestamp:
          type: string
          format: date-time
        total_count:
          type: integer
        destinations:
          type: array
          items:
            $ref: '#/components/schemas/DestinationEntry'

    DestinationEntry:
      type: object
      properties:
        ip:
          type: string
        location:
          type: string
          enum: [LAN, WAN]
        received_per_sec:
          type: number
        received_bytes_per_sec:
          type: number
        last_seen:
          type: string
          format: date-time

    HostTopPortsUpdate:
      type: object
      properties:
        type:
          type: string
          enum: [host_top_ports_update]
        id:
          type: string
        channel_id:
          type: string
        host_ip:
          type: string
        timestamp:
          type: string
          format: date-time
        total_count:
          type: integer
        ports:
          type: array
          items:
            $ref: '#/components/schemas/PortEntry'

    PortEntry:
      type: object
      properties:
        port:
          type: integer
        protocol:
          type: string
          description: "Network protocol identifier (e.g., TCP, UDP, ICMP)."
        packets_per_sec:
          type: number
        bytes_per_sec:
          type: number