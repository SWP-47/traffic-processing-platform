openapi: 3.0.3
info:
  title: Traffic Processing Platform API
  description: |
    API documentation for the Control and Status Server (CnSS).
    
    ## Ingestion (CN to CnSS)
    - **Protocol**: UDP
    - **Endpoint**: `{{cnss_host}}:{{cnss_udp_port}}`
    - **Payload Schema**: `TelemetryBatch` (defined in components/schemas)
    
    ## WebSocket Stream (CnSS to MUI)
    - **Endpoint**: `wss://{{cnss_host}}:{{cnss_ws_port}}/api/v1/ws/telemetry`
    - **Auth**: Query parameter `?token={{access_token}}`
    - **Payload Schema**: `TelemetryUpdate` (defined in components/schemas)
    - **Keep-Alive**: CnSS sends periodic `ping` frames. MUI must respond with `pong`.
  version: 1.0.0

servers:
  - url: https://{{cnss_host}}
    description: CnSS REST Server
  - url: wss://{{cnss_host}}:{{cnss_ws_port}}
    description: CnSS WebSocket Server

paths:
  /api/v1/health:
    get:
      summary: System Health Check
      description: Verify operational status of all modular components.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: System is healthy or degraded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              example:
                status: "healthy"
                components:
                  traffic_processor: "active"
                  communication_node: "active"
                  cnss: "active"
                timestamp: "2026-06-17T12:00:00Z"
        '503':
          description: System is unhealthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              example:
                status: "unhealthy"
                components:
                  traffic_processor: "error"
                  communication_node: "active"
                  cnss: "active"
                timestamp: "2026-06-17T12:00:00Z"

  /api/v1/channel/status:
    get:
      summary: Channel Activity Status
      description: REST fallback for channel activity indicator. The MUI should primarily use the WebSocket stream.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Channel status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChannelStatusResponse'
              example:
                channel_id: "primary-bridge-01"
                is_active: true
                last_activity_timestamp: "2026-06-17T12:00:00Z"

  /api/v1/ws/telemetry:
    get:
      summary: Real-time Telemetry Stream (WebSocket)
      description: |
        Upgrades to WebSocket for real-time push stream.
        Auth via query parameter `?token={{access_token}}`.
        
        **Connection Lifecycle:**
        1. MUI opens WebSocket connection.
        2. CnSS validates token. On failure, closes with code `4001` (invalid_token).
        3. CnSS pushes `telemetry_update` frames (2-10 Hz).
        4. **Keep-Alive:** CnSS sends periodic `ping` frames. MUI must respond with `pong`. If no `pong` is received, CnSS closes the connection to prevent memory leaks.
        5. If no telemetry from CN for 5000ms, CnSS sends `is_active: false`.
        
        *Security Note: CnSS MUST NOT log the full request URL to prevent token leakage.*
      parameters:
        - in: query
          name: token
          schema:
            type: string
          description: Bearer token for authentication
          required: true
      responses:
        '101':
          description: Switching Protocols to WebSocket

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    TelemetryBatch:
      type: object
      description: Payload sent from CN to CnSS over UDP.
      properties:
        channel_id:
          type: string
          example: "primary-bridge-01"
        sequence:
          type: integer
          example: 1042
        window_ms:
          type: integer
          example: 500
        direction_out:
          type: object
          properties:
            packets:
              type: integer
              example: 150
        direction_in:
          type: object
          properties:
            packets:
              type: integer
              example: 140
        timestamp:
          type: string
          format: date-time
          example: "2026-06-17T12:00:00Z"
          
    HealthResponse:
      type: object
      properties:
        status:
          type: string
          enum: [healthy, degraded, unhealthy]
          example: "healthy"
        components:
          type: object
          properties:
            traffic_processor:
              type: string
              enum: [active, inactive, error]
              example: "active"
            communication_node:
              type: string
              enum: [active, inactive, error]
              example: "active"
            cnss:
              type: string
              enum: [active, inactive, error]
              example: "active"
        timestamp:
          type: string
          format: date-time
          example: "2026-06-17T12:00:00Z"

    ChannelStatusResponse:
      type: object
      properties:
        channel_id:
          type: string
          example: "primary-bridge-01"
        is_active:
          type: boolean
          example: true
        last_activity_timestamp:
          type: string
          format: date-time
          example: "2026-06-17T12:00:00Z"
          
    TelemetryUpdate:
      type: object
      description: Payload pushed from CnSS to MUI over WebSocket.
      properties:
        type:
          type: string
          example: "telemetry_update"
        channel_id:
          type: string
          example: "primary-bridge-01"
        is_active:
          type: boolean
          example: true
        window_ms:
          type: integer
          example: 500
        dropped_batches:
          type: integer
          description: Number of lost UDP datagrams between the previous and current batch.
          example: 0
        metrics:
          type: object
          properties:
            direction_out:
              type: object
              properties:
                packets_per_sec:
                  type: number
                  format: float
                  example: 300.0
                packets:
                  type: integer
                  example: 150
            direction_in:
              type: object
              properties:
                packets_per_sec:
                  type: number
                  format: float
                  example: 280.0
                packets:
                  type: integer
                  example: 140
        timestamp:
          type: string
          format: date-time
          description: Original timestamp from the CN batch.
          example: "2026-06-17T12:00:00Z"
        received_at:
          type: string
          format: date-time
          description: Server time at CnSS when the UDP datagram was received.
          example: "2026-06-17T12:00:00.050Z"