# ==============================================================================
# CnSS Alembic Configuration
# Central configuration file for database schema migrations using Alembic.
# ==============================================================================

[alembic]
# path to migration scripts.
script_location = migrations

# The database URL is dynamically injected in env.py from core.config.settings.
# This placeholder is required by Alembic's config parser but will be overridden.
sqlalchemy.url = postgresql+asyncpg://placeholder:placeholder@localhost/placeholder

# --- Logging Configuration ---
# Defines how Alembic and SQLAlchemy log migration events and SQL statements.
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S