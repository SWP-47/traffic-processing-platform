# ==============================================================================
# CnSS Development Docker Compose Configuration
# Orchestrates infrastructure services (TimescaleDB, Redis, pgAdmin) for local development.
# Microservices (API, WS, Ingestion, Reporting) are intended to be run locally via IDE or `uv run`.
# ==============================================================================

services:
# ==============================================================================
# Infrastructure Services (Development)
# ==============================================================================

  # --- TimescaleDB (Persistent Storage) ---
  # Primary database for time-series telemetry and relational state.
  timescaledb:
    image: timescale/timescaledb:latest-pg15
    container_name: cnss-dev-timescaledb
    # Restart policy ensures immediate recovery if the container crashes
    restart: always
    environment:
      POSTGRES_USER: cnss
      POSTGRES_PASSWORD: cnss
      POSTGRES_DB: cnss
    ports:
      # Expose port to host for local microservices and IDE database tools
      - "5432:5432"
    volumes:
      - timescaledb_data:/var/lib/postgresql/data
    # Healthcheck to ensure TimescaleDB is ready to accept connections
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cnss -d cnss"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cnss-dev-network

  # --- Redis (Ephemeral State & Buffer) ---
  # In-memory data store for buffering, pub/sub, and ephemeral state.
  # Configured to run without persistence (Ephemeral Mode).
  redis:
    image: redis:7-alpine
    container_name: cnss-dev-redis
    restart: always
    ports:
      # Expose port to host for local microservices and Redis GUI tools
      - "6379:6379"
    volumes:
      # Mount custom Redis configuration to enforce ephemeral mode
      - ./docker/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    command: redis-server /usr/local/etc/redis/redis.conf
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cnss-dev-network

  # --- pgAdmin (Database Management UI) ---
  # Web-based database administration tool for local development and debugging.
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: cnss-dev-pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      # Expose pgAdmin web interface to host
      - "5050:80"
    depends_on:
      timescaledb:
        condition: service_healthy
    networks:
      - cnss-dev-network

# ==============================================================================
# Networks
# ==============================================================================
networks:
  cnss-dev-network:
    driver: bridge

# ==============================================================================
# Volumes
# ==============================================================================
volumes:
  timescaledb_data: