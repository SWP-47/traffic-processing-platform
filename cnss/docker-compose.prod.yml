services:
  cnss:
    build:
      context: .
      dockerfile: Dockerfile.prod
    ports:
      - "8000:8000"
    restart: always
    environment:
      - ENV=production
      - PORT=8000
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M