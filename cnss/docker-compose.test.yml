services:
  timescaledb-test:
    image: timescale/timescaledb:latest-pg15
    environment:
      POSTGRES_USER: traffic
      POSTGRES_PASSWORD: traffic
      POSTGRES_DB: traffic_db
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    # Note: No persistent volume mapped here to ensure a clean slate for every test run
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U traffic -d traffic_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  cnss-test:
    build:
      context: .
      dockerfile: Dockerfile
    # Override command to run pytest
    command: pytest tests/ -v --tb=short
    environment:
      - ENV=test
      - DATABASE_URL=postgresql://traffic:traffic@timescaledb-test:5432/traffic_db
    # Do not mount volume so tests run on code from the image
    depends_on:
      timescaledb-test:
        condition: service_healthy