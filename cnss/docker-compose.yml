# Production deployment: all microservices + infrastructure behind Nginx.

services:
  # ============================================================================
  # Infrastructure
  # ============================================================================

  # --- TimescaleDB (Persistent Storage) ---
  timescaledb:
    image: timescale/timescaledb:latest-pg15
    container_name: cnss-timescaledb
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cnss}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cnss}
      POSTGRES_DB: ${POSTGRES_DB:-cnss}
    volumes:
      - timescaledb_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cnss} -d ${POSTGRES_DB:-cnss}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cnss-network

  # --- Redis (Ephemeral State & Buffer) ---
  redis:
    image: redis:7-alpine
    container_name: cnss-redis
    restart: unless-stopped
    volumes:
      - ./docker/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    command: redis-server /usr/local/etc/redis/redis.conf
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cnss-network

  # ============================================================================
  # Microservices
  # ============================================================================

  # --- REST API & Auth Service ---
  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    container_name: cnss-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-cnss}:${POSTGRES_PASSWORD:-cnss}@timescaledb:5432/${POSTGRES_DB:-cnss}
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      timescaledb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - cnss-network

  # --- WebSocket Service ---
  websocket:
    build:
      context: .
      dockerfile: docker/websocket.Dockerfile
    container_name: cnss-websocket
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-cnss}:${POSTGRES_PASSWORD:-cnss}@timescaledb:5432/${POSTGRES_DB:-cnss}
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      timescaledb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - cnss-network

  # --- Ingestion Worker (UDP Listener & Buffer Manager) ---
  ingestion:
    build:
      context: .
      dockerfile: docker/ingestion.Dockerfile
    container_name: cnss-ingestion
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-cnss}:${POSTGRES_PASSWORD:-cnss}@timescaledb:5432/${POSTGRES_DB:-cnss}
      - REDIS_URL=redis://redis:6379/0
    ports:
      - "${CnSS_UDP_PORT:-5140}:5140/udp"
    depends_on:
      timescaledb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - cnss-network

  # --- Reporting Worker (Background Aggregator) ---
  reporting:
    build:
      context: .
      dockerfile: docker/reporting.Dockerfile
    container_name: cnss-reporting
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-cnss}:${POSTGRES_PASSWORD:-cnss}@timescaledb:5432/${POSTGRES_DB:-cnss}
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      timescaledb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - cnss-network

  # ============================================================================
  # Reverse Proxy
  # ============================================================================

  # --- Nginx (TLS Termination & Routing) ---
  nginx:
    image: nginx:alpine
    container_name: cnss-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - api
      - websocket
    networks:
      - cnss-network

# ==============================================================================
# Networks
# ==============================================================================
networks:
  cnss-network:
    driver: bridge

# ==============================================================================
# Volumes
# ==============================================================================
volumes:
  timescaledb_data: