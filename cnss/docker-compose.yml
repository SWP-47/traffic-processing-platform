# ==============================================================================
# CnSS Production Docker Compose Configuration
# Orchestrates all microservices and infrastructure components for production.
# Includes TimescaleDB, Redis, 4 Microservices, and Nginx reverse proxy.
# ==============================================================================

services:
# ==============================================================================
# Infrastructure Services
# ==============================================================================

  # --- TimescaleDB (Persistent Storage) ---
  # Primary database for time-series telemetry and relational state.
  timescaledb:
    image: timescale/timescaledb:latest-pg15
    container_name: cnss-timescaledb
    # Restart policy ensures immediate recovery if the container crashes
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cnss}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cnss}
      POSTGRES_DB: ${POSTGRES_DB:-cnss}
    volumes:
      - timescaledb_data:/var/lib/postgresql/data
    # Healthcheck to ensure TimescaleDB is ready to accept connections
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cnss} -d ${POSTGRES_DB:-cnss}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cnss-network

  # --- Redis (Ephemeral State & Buffer) ---
  # In-memory data store for buffering, pub/sub, and ephemeral state.
  # Configured to run without persistence (Ephemeral Mode).
  redis:
    image: redis:7-alpine
    container_name: cnss-redis
    restart: always
    volumes:
      # Mount custom Redis configuration to enforce ephemeral mode
      - ./docker/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    command: redis-server /usr/local/etc/redis/redis.conf
    sysctls:
      # Increase connection backlog queue for high-throughput scenarios
      - net.core.somaxconn=1024
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cnss-network

# ==============================================================================
# Microservices
# ==============================================================================

  # --- REST API & Auth Service ---
  # HTTP gateway, identity management, and historical data retrieval.
  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    container_name: cnss-api
    restart: always
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-cnss}:${POSTGRES_PASSWORD:-cnss}@timescaledb:5432/${POSTGRES_DB:-cnss}
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      timescaledb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - cnss-network

  # --- WebSocket Service ---
  # Persistent client connection management and subscription routing.
  websocket:
    build:
      context: .
      dockerfile: docker/websocket.Dockerfile
    container_name: cnss-websocket
    restart: always
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-cnss}:${POSTGRES_PASSWORD:-cnss}@timescaledb:5432/${POSTGRES_DB:-cnss}
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      timescaledb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - cnss-network

  # --- Ingestion Worker (UDP Listener & Buffer Manager) ---
  # High-performance telemetry ingestion, sequence tracking, and database buffering.
  ingestion:
    build:
      context: .
      dockerfile: docker/ingestion.Dockerfile
    container_name: cnss-ingestion
    restart: always
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-cnss}:${POSTGRES_PASSWORD:-cnss}@timescaledb:5432/${POSTGRES_DB:-cnss}
      - REDIS_URL=redis://redis:6379/0
    ports:
      # Expose UDP port for receiving TelemetryBatch payloads from Communication Nodes
      - "${CnSS_UDP_PORT:-5140}:5140/udp"
    depends_on:
      timescaledb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - cnss-network

  # --- Reporting Worker (Background Aggregator) ---
  # Periodic metric aggregation, state synchronization, and real-time event publishing.
  reporting:
    build:
      context: .
      dockerfile: docker/reporting.Dockerfile
    container_name: cnss-reporting
    restart: always
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-cnss}:${POSTGRES_PASSWORD:-cnss}@timescaledb:5432/${POSTGRES_DB:-cnss}
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      timescaledb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - cnss-network

networks:
  cnss-network:
    driver: bridge
    name: cnss-network 

# ==============================================================================
# Volumes
# ==============================================================================
volumes:
  timescaledb_data: