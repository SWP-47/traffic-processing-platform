# ==============================================================================
# CnSS Nginx Reverse Proxy Configuration
# Handles external routing, TLS termination (HTTPS/WSS), and request forwarding
# to the internal API and WebSocket microservices. Enforces security logging
# to prevent JWT token leakage in access logs.
# ==============================================================================

# --- Worker Processes & Events ---
# Automatically scale worker processes to the number of available CPU cores.
worker_processes auto;

events {
    # Max concurrent connections per worker process
    worker_connections 1024;
}

# --- Logging & Security ---
# Custom log format to prevent JWT token leakage.
# By logging $uri instead of $request_uri, query parameters (containing tokens) are strictly excluded from logs.
log_format secure '$remote_addr - $remote_user [$time_local] "$request_method $uri $server_protocol" '
                  '$status $body_bytes_sent "$http_referer" "$http_user_agent"';

# Map for WebSocket connection upgrade headers.
# Dynamically sets the 'Connection' header based on the client's 'Upgrade' request.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# --- Upstream Definitions ---
# Internal Docker network service discovery for the microservices.
# Both services listen on port 8000 internally as defined in their respective Dockerfiles.
upstream api_backend {
    server api:8000;
}

upstream ws_backend {
    server websocket:8000;
}

http {
    # Apply the secure log format to the default access log
    access_log /var/log/nginx/access.log secure;
    error_log /var/log/nginx/error.log warn;

    # --- HTTP Server (Redirect to HTTPS) ---
    # Redirect all plain HTTP traffic to HTTPS to enforce transport security.
    server {
        listen 80;
        server_name _;

        return 301 https://$host$request_uri;
    }

    # --- HTTPS Server (TLS Termination & Routing) ---
    # Handles external secure connections and routes them to internal microservices.
    server {
        listen 443 ssl;
        server_name _;

        # --- TLS Configuration ---
        # Paths to the SSL certificate and private key mounted from the host.
        ssl_certificate /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;

        # Enforce modern TLS protocols and ciphers for security
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;

        # --- REST API Routing ---
        # Forward all /api/ requests to the FastAPI REST service.
        location /api/ {
            proxy_pass http://api_backend;
            
            # Standard proxy headers to preserve client identity and protocol
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # --- WebSocket Routing ---
        # Forward all /ws/ requests to the WebSocket gateway service.
        location /ws/ {
            proxy_pass http://ws_backend;
            
            # Mandatory headers for WebSocket protocol upgrade
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            
            # Standard proxy headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Increase timeouts for persistent WebSocket connections
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # --- Default Routing ---
        # Fallback to the API service for root requests (e.g., /health, /docs).
        location / {
            proxy_pass http://api_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}