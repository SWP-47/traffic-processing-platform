# ==============================================================================
# CnSS Redis Configuration (Ephemeral Mode)
# Configures Redis to operate purely as an in-memory, ephemeral buffer and
# state cache. All persistence mechanisms (RDB and AOF) are explicitly disabled
# to maximize IOPS and prevent disk-write bottlenecks, as per architecture.
# ==============================================================================

# --- Network & Security ---
# Bind to all interfaces within the Docker network to allow container communication.
bind 0.0.0.0

# Default Redis port.
port 6379

# Disable protected mode to allow connections from other Docker containers
# without requiring a password, relying on Docker network isolation.
protected-mode no

# --- Execution Mode ---
# Run in the foreground. Required for Docker containers to keep the main process alive.
daemonize no

# --- Persistence Strategy (Disabled) ---
# Explicitly disable RDB snapshots to prevent disk I/O and ensure ephemeral operation.
save ""

# Disable Append Only File (AOF) persistence.
appendonly no

# --- Memory Management ---
# Set a memory limit to prevent Redis from consuming all available container memory.
maxmemory 2gb

# Eviction policy when maxmemory is reached.
# 'noeviction' is chosen because the Ingestion Worker explicitly caps the UDP buffer
# lists using LTRIM. We prefer the application to handle buffer limits rather than
# Redis silently evicting critical state keys or sequence trackers.
maxmemory-policy noeviction

# --- Logging ---
# Set log level to 'notice' for standard operational visibility in Docker logs.
loglevel notice

# Log to standard output so Docker can capture it via 'docker logs'.
logfile ""