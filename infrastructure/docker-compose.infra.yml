# ==============================================================================
# Infrastructure Layer Docker Compose Configuration
# Orchestrates ONLY the Edge Nginx reverse proxy.
# Connects to external Docker networks (cnss-network, mui-network) for routing.
# MUI and CnSS services are launched independently via their own docker-compose files.
# ==============================================================================

services:
  # ============================================================================
  # Edge Nginx (TLS Termination & Unified Routing)
  # ============================================================================
  # Single entry point for all external traffic. Routes requests to:
  # - MUI container (via mui-network)
  # - CnSS API and WebSocket (via cnss-network)
  # All backend services must be running BEFORE starting this infrastructure layer.
  edge-nginx:
    image: nginx:alpine
    container_name: edge-nginx
    restart: always
    ports:
      - "80:80"    # HTTP redirect to HTTPS
      - "443:443"  # HTTPS/WSS (TLS termination)
    volumes:
      # Mount Nginx configuration (read-only)
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      # Mount TLS certificates (read-only, generated by `make certs`)
      - ./nginx/certs:/etc/nginx/certs:ro
    networks:
      - cnss-network  # Connect to CnSS backend services
      - mui-network   # Connect to MUI frontend container

# ==============================================================================
# Networks
# ==============================================================================
# Both networks are external — they must be created by other docker-compose files
# BEFORE starting this infrastructure layer.
networks:
  cnss-network:
    external: true   # Created by cnss/docker-compose.yml
    name: cnss-network
  mui-network:
    external: true   # Created by mui/docker-compose.yaml
    name: mui-network