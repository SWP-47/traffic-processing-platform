# ==============================================================================
# Edge Nginx Configuration
# Unified reverse proxy for MUI (static) and CnSS (API/WebSocket).
# ==============================================================================

worker_processes auto;

events {
    worker_connections 1024;
}

# --- Logging ---
log_format secure '$remote_addr - $remote_user [$time_local] "$request_method $uri $server_protocol" '
                  '$status $body_bytes_sent "$http_referer" "$http_user_agent"';

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# --- Upstream Definitions ---
upstream cnss_api {
    server cnss-api:8000;  # Имя контейнера CnSS API
}

upstream cnss_ws {
    server cnss-websocket:8000;  # Имя контейнера CnSS WebSocket
}

http {
    access_log /var/log/nginx/access.log secure;
    error_log /var/log/nginx/error.log warn;

    # --- HTTP Redirect ---
    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    # --- HTTPS Server ---
    server {
        listen 443 ssl;
        server_name _;

        # --- TLS ---
        ssl_certificate /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;

        # --- MUI Static Files ---
        location / {
            root /usr/share/nginx/mui;
            index index.html;
            try_files $uri $uri/ /index.html;  # SPA fallback
        }

        # --- CnSS REST API ---
        location /api/ {
            proxy_pass http://cnss_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # --- CnSS WebSocket ---
        location /ws/ {
            proxy_pass http://cnss_ws;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }
    }
}