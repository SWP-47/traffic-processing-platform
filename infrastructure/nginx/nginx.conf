worker_processes auto;

events {
    worker_connections 1024;
}

http {
    log_format secure '$remote_addr - $remote_user [$time_local] "$request_method $uri $server_protocol" '
                      '$status $body_bytes_sent "$http_referer" "$http_user_agent"';

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # ==============================================================================
    # Docker DNS Resolver
    # ==============================================================================
    # Required for dynamic resolution of container names when using variables in proxy_pass.
    # 127.0.0.11 is the internal Docker DNS server.
    resolver 127.0.0.11 valid=10s ipv6=off;

    access_log /var/log/nginx/access.log secure;
    error_log /var/log/nginx/error.log warn;

    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        server_name _;

        ssl_certificate /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;

        # ==============================================================================
        # MUI Frontend (Optional)
        # ==============================================================================
        # Uses a variable to defer DNS resolution to request time.
        # If MUI is down, Nginx returns 502, which we intercept to show a custom message.
        location / {
            set $mui_backend "http://mui:80";
            proxy_pass $mui_backend;
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Intercept 502/504 errors to return a custom JSON/HTML response
            proxy_intercept_errors on;
            error_page 502 504 = @mui_unavailable;
        }

        # Fallback response when MUI is not running
        location @mui_unavailable {
            default_type application/json;
            return 503 '{\n  "error": "mui_unavailable",\n  "message": "Management User Interface is currently offline. Please start the MUI container."\n}';
        }

        # ==============================================================================
        # CnSS REST API (Optional)
        # ==============================================================================
        location /api/ {
            set $cnss_api_backend "http://cnss-api:8000";
            proxy_pass $cnss_api_backend;
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ==============================================================================
        # CnSS WebSocket (Optional)
        # ==============================================================================
        location /api/v1/ws/ {
            set $cnss_ws_backend "http://cnss-websocket:8001";
            proxy_pass $cnss_ws_backend;
            
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }
    }
}