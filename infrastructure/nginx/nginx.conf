# ==============================================================================
# Edge Nginx Configuration
# Unified reverse proxy for MUI (static) and CnSS (API/WebSocket).
# Single point of TLS termination and routing for the entire platform.
# ==============================================================================

worker_processes auto;

events {
    worker_connections 1024;
}

# --- Logging & Security ---
# Custom log format to prevent JWT token leakage in access logs.
# Logs $uri instead of $request_uri to exclude query parameters (tokens).
log_format secure '$remote_addr - $remote_user [$time_local] "$request_method $uri $server_protocol" '
                  '$status $body_bytes_sent "$http_referer" "$http_user_agent"';

# Map for WebSocket connection upgrade headers
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# --- Upstream Definitions ---
# Container names resolved via Docker DNS (127.0.0.11)
upstream mui_frontend {
    server mui:80;  # MUI container (static files only)
}

upstream cnss_api {
    server cnss-api:8000;  # CnSS REST API
}

upstream cnss_websocket {
    server cnss-websocket:8001;  # CnSS WebSocket
}

http {
    access_log /var/log/nginx/access.log secure;
    error_log /var/log/nginx/error.log warn;

    # --- HTTP Redirect to HTTPS ---
    # Enforce TLS for all external traffic
    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    # --- HTTPS Server (TLS Termination) ---
    server {
        listen 443 ssl;
        server_name _;

        # --- TLS Configuration ---
        ssl_certificate /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;

        # --- Security Headers ---
        # HSTS: force browsers to use HTTPS for 1 year
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;

        # --- MUI Frontend (Static Files) ---
        # Proxies to MUI container, which serves only static assets
        location / {
            proxy_pass http://mui_frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # --- CnSS REST API ---
        # Routes all /api/* requests to the FastAPI backend
        location /api/ {
            proxy_pass http://cnss_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # --- CnSS WebSocket ---
        # Routes WebSocket connections with proper upgrade headers
        location /api/v1/ws/ {
            proxy_pass http://cnss_websocket;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # Long timeouts for persistent WebSocket connections
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }
    }
}