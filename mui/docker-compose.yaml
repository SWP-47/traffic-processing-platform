services:
  # =========================================
  # PRODUCTION
  # =========================================
  mui:
    image: mui:prod
    container_name: mui

    build:
      context: .
      dockerfile: Dockerfile

    restart: unless-stopped

    networks:
      - mui-network

    profiles:
      - prod
  

  # =========================================
  # DEVELOPMENT
  # =========================================
  mui-dev:
    image: mui:dev
    container_name: mui-dev

    build:
      context: .
      dockerfile: Dockerfile.dev

    ports:
      - "5173:5173"

    develop:
      watch:
        - action: rebuild
          path: ./package.json
        
        - action: rebuild
          path: ./vite.config.ts

        - action: sync
          path: .
          target: /app
          ignore:
            - nginx.conf

    env_file:
      - .env

    networks:
      - mui-network
  
    profiles:
      - dev

networks:
  mui-network:
    driver: bridge
    name: mui-network